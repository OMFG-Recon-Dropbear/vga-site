name: Build and publish container image

# Builds the Next.js site into a container image and pushes it to GitHub Container Registry.
# The Synology NAS pulls ghcr.io/<owner>/vga-site:latest (see docker-compose.yml).
#
# Source can be provided three ways (checked in this order):
#   1. Checked in normally (git push) — the repo root is the build context.
#   2. Web-upload path: split zip parts at the repo root (vga-site-src.zip.part-00, -01, …) holding the full tree.
#   3. Code overlay: vga-site-code.zip at the repo root holding everything EXCEPT public/. When present it
#      replaces the code from (2) while public/ (images, PDFs, fonts ≈100 MB) is kept from the parts, so a code
#      change only needs one small upload. Re-upload the parts only when public/ changes.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   NEXT_PUBLIC_SITE_URL   canonical/OG/sitemap base (default: staging host)
#   SITE_NOINDEX           '1' = staging build with noindex (default); set to '' for the production build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push cancels an older in-flight build so :latest always comes from the newest commit.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm # ARM64 to match the Synology DS; use ubuntu-latest for x86-64 hosts
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source (web-upload path)
        id: src
        run: |
          set -e
          mkdir -p /tmp/src
          if ls vga-site-src.zip.part-* >/dev/null 2>&1; then
            cat vga-site-src.zip.part-* > /tmp/src.zip
            unzip -q /tmp/src.zip -d /tmp/src
          elif [ -f vga-site-src.zip ]; then
            unzip -q vga-site-src.zip -d /tmp/src
          fi
          if [ -f vga-site-code.zip ]; then
            echo "Applying code overlay (public/ kept from the base archive)"
            find /tmp/src -mindepth 1 -maxdepth 1 ! -name public -exec rm -rf {} +
            unzip -qo vga-site-code.zip -d /tmp/src
          fi
          if [ -z "$(ls -A /tmp/src)" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=/tmp/src" >> "$GITHUB_OUTPUT"
          fi
          echo "Build context:"; ls -la "$(sed -n 's/^dir=//p' "$GITHUB_OUTPUT" | tail -1)"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=$(echo 'ghcr.io/${{ github.repository_owner }}/vga-site' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.src.outputs.dir }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://vga.disruptivelabs.com.au' }}
            SITE_NOINDEX=${{ vars.SITE_NOINDEX || '1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
